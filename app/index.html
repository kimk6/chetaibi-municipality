<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>بلدية شطايبي</title>
    <!-- هذا الملف هو بيئة التطبيق المنفصلة — يُحرَّر بشكل مستقل تماماً عن index.html الرئيسي -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', 'Segoe UI', sans-serif;
            background: #ffffff;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        .logo {
            width: 96px;
            height: 96px;
            border-radius: 22px;
            margin-bottom: 24px;
        }
        h1 {
            font-size: 22px;
            font-weight: 900;
            color: #064e3b;
            margin-bottom: 8px;
        }
        p {
            font-size: 13px;
            color: #6b7280;
        }
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #d1fae5;
            border-top-color: #059669;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 32px auto 0;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <img
        class="logo"
        src="https://cdn.jsdelivr.net/gh/kimk6/chetaibi-assets-v1@main/ui/512_any.png"
        alt="شعار بلدية شطايبي"
    >
    <h1>بلدية شطايبي</h1>
    <p>ولاية عنابة — الجزائر</p>
    <div class="spinner"></div>
    <!--
    ════════════════════════════════════════════════════
     هذا الملف هو نقطة البداية للتطبيق PWA
     ابنِ تصميم التطبيق العصري هنا بشكل مستقل تماماً
     دون الحاجة للتعديل على index.html الرئيسي
    ════════════════════════════════════════════════════
    -->
</body>
</html>
