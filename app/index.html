<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#042f1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>شطايبي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --green:#059669;--green-d:#064e3b;--green-m:#047857;--green-l:#d1fae5;
  --surface:#f2f4f7;--card:#ffffff;--text:#111827;--muted:#6b7280;
  --border:#e5e7eb;--border-light:#f3f4f6;
  --nav-h:62px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  --shadow-sm:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 16px rgba(0,0,0,.10),0 1px 4px rgba(0,0,0,.06);
}
*{
  margin:0;padding:0;box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;
  -webkit-user-select:none;user-select:none;
  outline:none !important;
  -webkit-font-smoothing:antialiased;
}
html{height:100%;height:100dvh;overflow:hidden;overscroll-behavior:none;}
body{
  height:100%;height:100dvh;
  overflow:hidden;overscroll-behavior:none;
  font-family:'Cairo',sans-serif;
  background:var(--surface);color:var(--text);
  position:fixed;width:100%;top:0;left:0;
}
img{
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;
  pointer-events:none;-webkit-user-drag:none;
}
img.clickable{pointer-events:auto !important;cursor:pointer;}
#app{display:flex;flex-direction:column;height:100%;height:100dvh;overflow:hidden;}
#screen-container{flex:1;min-height:0;position:relative;overflow:hidden;}
.screen{position:absolute;inset:0;overflow:hidden;will-change:transform,opacity;}
.screen.hidden{display:none;pointer-events:none;}

/* ══ SHARED HEADER ══
   - z-index:1 → المحتوى (z-index:2) يغطيه عند السكرول
   - position:absolute داخل screen-container → لا يتحرك مع animation الانتقال
     لأنه خارج الـ .screen elements
*/
#shared-header{
  position:absolute;
  top:0;left:0;right:0;
  z-index:1;
  background:linear-gradient(145deg,#042f1e 0%,var(--green-d) 40%,var(--green-m) 75%,#059669 100%);
  overflow:hidden;
  /* مهم: لا will-change ولا transform هنا */
}
#shared-header::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 85% 20%,rgba(255,255,255,.07) 0%,transparent 60%);
  pointer-events:none;
}
.shared-header-inner{
  display:flex;align-items:center;gap:14px;
  position:relative;z-index:1;
  padding:calc(var(--safe-t) + 16px) 18px 16px;
}
.header-logo{
  width:52px;height:52px;border-radius:14px;
  background:#fff;object-fit:contain;flex-shrink:0;
  pointer-events:none;display:block;
}
.header-text{flex:1;}
.header-text h1{font-size:20px;font-weight:900;color:#fff;letter-spacing:-.3px;line-height:1.2;}
.header-text p{font-size:11px;color:rgba(255,255,255,.65);font-weight:600;margin-top:2px;}
.header-btn{
  width:36px;height:36px;border-radius:10px;
  background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;touch-action:manipulation;flex-shrink:0;transition:background .15s;
}
.header-btn:active{background:rgba(255,255,255,.28);}
.header-actions{display:flex;align-items:center;gap:8px;}
.header-action{display:none;}
.header-action.visible{display:flex;}

/* ══ SCROLL AREA ══
   z-index:2 → يغطي الهيدر (z-index:1) عند السكرول للأسفل
   هذا هو سر الاختفاء التدريجي للهيدر
*/
.scroll-area{
  position:absolute;inset:0;
  z-index:2;
  overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-y:contain;
}

/* ══ CONTENT BLOCK ══ */
.content-block{
  background:var(--surface);
  border-radius:20px 20px 0 0;
  min-height:100%;position:relative;
}

/* ══ MAP ══ */
#screen-map .scroll-area{overflow:hidden;padding-top:0 !important;}
#app-map{position:absolute;inset:0;width:100%;height:100%;}

/* ══ BOTTOM NAV ══ */
#bottom-nav{
  flex-shrink:0;
  height:calc(var(--nav-h) + var(--safe-b));
  padding-bottom:var(--safe-b);
  background:rgba(255,255,255,.97);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--border-light);
  display:flex;align-items:flex-start;padding-top:8px;
  z-index:100;
  box-shadow:0 -1px 0 rgba(0,0,0,.06),0 -4px 16px rgba(0,0,0,.04);
}
.nav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  border:none;background:none;cursor:pointer;
  font-family:'Cairo',sans-serif;font-size:10px;font-weight:700;
  color:var(--muted);padding:0 4px;position:relative;
  touch-action:manipulation;transition:color .2s ease;
}
.nav-icon-wrap{
  position:relative;width:24px;height:24px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.nav-btn .icon-on{
  display:block;position:absolute;opacity:0;
  transition:opacity .2s ease;pointer-events:none;
}
.nav-btn .icon-off{
  display:block;opacity:1;
  transition:opacity .2s ease;pointer-events:none;
}
.nav-btn.active .icon-on{opacity:1;}
.nav-btn.active .icon-off{opacity:0;}
.nav-btn::before{
  content:'';position:absolute;top:-8px;left:50%;
  transform:translateX(-50%) scaleX(0);
  width:28px;height:3px;border-radius:0 0 3px 3px;
  background:var(--green);
  transition:transform .25s cubic-bezier(.34,1.56,.64,1);
}
.nav-btn.active{color:var(--green);}
.nav-btn.active::before{transform:translateX(-50%) scaleX(1);}
.nav-btn span{pointer-events:none;}

/* ══ SECTIONS ══ */
.section{padding:16px 0 4px;}
.section-header{display:flex;align-items:center;justify-content:space-between;padding:0 18px;margin-bottom:12px;}
.section-title{font-size:14px;font-weight:900;color:var(--text);display:flex;align-items:center;gap:7px;}
.see-all{
  font-size:11px;font-weight:800;color:var(--green);border:none;
  background:var(--green-l);padding:4px 11px;border-radius:99px;
  cursor:pointer;font-family:'Cairo',sans-serif;
  touch-action:manipulation;transition:opacity .15s;
}
.see-all:active{opacity:.6;}

/* ══ H-SCROLL ══ */
.h-scroll{
  display:flex;gap:12px;overflow-x:auto;
  padding:2px 18px 14px;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-x:contain;
  scrollbar-width:none;
}
.h-scroll::-webkit-scrollbar{display:none;}

/* ══ NEWS CARD ══ */
.news-card{
  min-width:210px;max-width:210px;
  background:var(--card);border-radius:18px;
  overflow:hidden;box-shadow:var(--shadow-md);
  flex-shrink:0;border:1px solid var(--border-light);
  cursor:pointer;display:flex;flex-direction:column;
  touch-action:manipulation;transition:transform .15s ease,opacity .15s;
}
.news-card:active{transform:scale(.95);opacity:.8;}
.news-card-img{width:100%;height:125px;object-fit:cover;display:block;flex-shrink:0;pointer-events:none;}
.news-card-img-ph{width:100%;height:125px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.news-card-body{padding:10px 12px 6px;flex:1;display:flex;flex-direction:column;gap:4px;}
.news-card-excerpt{font-size:11px;color:var(--muted);line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;flex:1;}
.news-card-footer{
  display:flex;justify-content:space-between;align-items:center;
  padding:6px 12px;border-top:1px solid var(--border-light);margin-top:auto;
}
.card-date{
  display:flex;align-items:center;gap:3px;
  font-size:10px;color:var(--muted);font-weight:600;flex-shrink:0;
}
.card-date iconify-icon{font-size:12px;pointer-events:none;flex-shrink:0;}
.read-more{
  font-size:11px;font-weight:800;color:var(--green);
  border:none;background:none;cursor:pointer;
  font-family:'Cairo',sans-serif;touch-action:manipulation;
  display:flex;align-items:center;gap:4px;
}
.read-more iconify-icon{font-size:13px;pointer-events:none;flex-shrink:0;}

/* ══ PLACE CARD ══ */
.place-card{
  min-width:158px;max-width:158px;border-radius:18px;overflow:hidden;
  box-shadow:var(--shadow-md);flex-shrink:0;
  cursor:pointer;position:relative;height:210px;
  touch-action:manipulation;transition:transform .15s ease,opacity .15s;
}
.place-card:active{transform:scale(.95);opacity:.8;}
.place-card img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;}
.place-card-grad{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.78) 0%,rgba(0,0,0,.1) 55%,transparent 80%);pointer-events:none;}
.place-card-body{position:absolute;bottom:0;left:0;right:0;padding:10px;pointer-events:none;}
.place-card-name{font-size:12px;font-weight:900;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.6);line-height:1.3;}
.place-card-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;}

/* ══ SEG BAR ══ */
.seg-bar-wrap{background:var(--surface);border-bottom:1px solid var(--border-light);}
.seg-bar{
  display:flex;gap:8px;overflow-x:auto;
  -webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;
  scrollbar-width:none;padding:10px 14px;
}
.seg-bar::-webkit-scrollbar{display:none;}
.seg-btn{
  flex-shrink:0;display:flex;align-items:center;gap:6px;
  padding:0 16px;height:36px;border-radius:99px;
  border:1.5px solid var(--border);background:var(--card);color:var(--muted);
  font-family:'Cairo',sans-serif;font-size:11.5px;font-weight:800;
  cursor:pointer;touch-action:manipulation;white-space:nowrap;
  box-shadow:var(--shadow-sm);
  transition:background .2s,color .2s,border-color .2s,box-shadow .2s;
}
.seg-btn iconify-icon{font-size:15px;pointer-events:none;flex-shrink:0;}
.seg-btn.active{
  background:var(--green);color:#fff;border-color:var(--green);
  box-shadow:0 4px 14px rgba(5,150,105,.3);
}
.seg-btn:active:not(.active){opacity:.65;}

/* ══ ANNOUNCE CARD ══ */
.announce-card{
  background:var(--card);border-radius:18px;
  border:1px solid var(--border-light);
  overflow:hidden;box-shadow:var(--shadow-sm);cursor:pointer;
  margin:0 18px 12px;
  touch-action:manipulation;transition:transform .15s ease,opacity .15s;
}
.announce-card:active{transform:scale(.98);opacity:.8;}
.announce-img-wrap{width:100%;height:165px;display:flex;align-items:center;justify-content:center;background:#f0fdf4;overflow:hidden;}
.announce-img-wrap img{width:100%;height:100%;object-fit:cover;pointer-events:none;}
.announce-body{padding:11px 14px 13px;}
.announce-footer{
  display:flex;justify-content:space-between;align-items:center;
  padding-top:8px;border-top:1px solid var(--border-light);margin-top:7px;
}

/* ══ POSTER CARD ══ */
.poster-card{
  border-radius:18px;overflow:hidden;box-shadow:var(--shadow-md);
  cursor:pointer;margin:0 18px 12px;
  touch-action:manipulation;transition:transform .15s ease,opacity .15s;
  position:relative;pointer-events:auto;line-height:0;
}
.poster-card:active{transform:scale(.98);opacity:.8;}
.poster-card img{width:100%;display:block;object-fit:cover;pointer-events:none;}
.poster-card-ph{width:100%;height:220px;display:flex;align-items:center;justify-content:center;line-height:normal;}

/* ══ FAC CARD ══ */
.fac-card{
  background:var(--card);border-radius:16px;
  border:1px solid var(--border-light);
  overflow:hidden;box-shadow:var(--shadow-sm);cursor:pointer;
  margin:0 18px 10px;display:flex;align-items:center;
  touch-action:manipulation;transition:transform .15s ease,opacity .15s;
}
.fac-card:active{transform:scale(.97);opacity:.8;}
.fac-card-img{width:80px;height:80px;object-fit:cover;flex-shrink:0;pointer-events:none;}
.fac-card-ph{width:80px;height:80px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.fac-card-body{padding:10px 12px;flex:1;min-width:0;}
.fac-card-badge{font-size:10px;font-weight:800;padding:2px 8px;border-radius:99px;display:inline-block;margin-bottom:4px;}
.fac-card-name{font-size:13px;font-weight:800;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.fac-card-desc{font-size:11px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px;}

/* ══ MORE ══ */
.more-item{
  display:flex;align-items:center;gap:14px;padding:14px 16px;
  border-bottom:1px solid var(--border-light);cursor:pointer;
  touch-action:manipulation;transition:background .15s,opacity .15s;
}
.more-item:active{background:var(--surface);opacity:.7;}
.more-item:last-child{border-bottom:none;}
.more-icon{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.more-item-title{font-size:14px;font-weight:800;color:var(--text);}
.more-item-sub{font-size:11px;color:var(--muted);margin-top:1px;}

/* ══ FOOTER ══ */
.app-footer{text-align:center;padding:24px 20px 12px;border-top:1px solid var(--border-light);margin-top:8px;}
.app-footer-main{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;}
.app-footer-sub{font-size:11px;color:#9ca3af;font-style:italic;line-height:1.5;}

/* ══ MODAL ══ */
.modal-overlay{
  position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:flex;align-items:flex-end;
  opacity:0;pointer-events:none;transition:opacity .25s ease;
}
.modal-overlay.open{opacity:1;pointer-events:auto;}
.modal-sheet{
  width:100%;background:#fff;border-radius:24px 24px 0 0;
  max-height:94dvh;overflow-y:auto;overflow-x:hidden;
  padding-bottom:calc(var(--safe-b) + 24px);
  transform:translateY(100%);
  transition:transform .35s cubic-bezier(.32,1.2,.54,1);
  touch-action:pan-y;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  position:relative;
}
.modal-overlay.open .modal-sheet{transform:translateY(0);}
.modal-drag{
  width:40px;height:4px;
  background:rgba(255,255,255,.65);
  border-radius:99px;
  position:absolute;
  top:10px;left:50%;
  transform:translateX(-50%);
  z-index:20;
  pointer-events:none;
  box-shadow:0 1px 3px rgba(0,0,0,.25);
}
.modal-img{width:100%;height:220px;object-fit:cover;display:block;pointer-events:none;}
.modal-body{padding:16px 20px;}
.modal-badge{font-size:11px;font-weight:800;padding:3px 12px;border-radius:99px;display:inline-block;margin-bottom:8px;}
.modal-name{font-size:19px;font-weight:900;color:var(--text);margin-bottom:8px;line-height:1.3;letter-spacing:-.3px;}
.modal-desc{font-size:13px;color:var(--muted);line-height:1.8;margin-bottom:14px;}
.modal-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.modal-chip{font-size:11px;padding:5px 12px;background:var(--surface);border:1px solid var(--border);border-radius:99px;color:var(--text);font-weight:600;display:flex;align-items:center;gap:5px;}
.album-title{font-size:13px;font-weight:800;color:var(--text);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.album-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;}
.album-grid img{
  width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;
  cursor:pointer;pointer-events:auto !important;
  touch-action:manipulation;display:block;
}
.big-album-img{
  width:100%;display:block;cursor:pointer;
  touch-action:manipulation;pointer-events:auto !important;
  margin-bottom:3px;line-height:0;
}

/* ══ LIGHTBOX ══ */
#lightbox{
  position:fixed;inset:0;z-index:500;
  background:rgba(0,0,0,.97);
  display:none;align-items:center;justify-content:center;
  padding:16px;overscroll-behavior:none;
}
#lightbox.open{display:flex;}
#lightbox img{max-width:100%;max-height:90dvh;object-fit:contain;border-radius:10px;pointer-events:none;}
#lb-close{
  position:absolute;top:calc(var(--safe-t) + 14px);left:14px;
  width:36px;height:36px;
  background:rgba(255,255,255,.18);border:none;border-radius:50%;
  color:#fff;font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(4px);touch-action:manipulation;pointer-events:auto;
}

/* ══ LOADING / EMPTY ══ */
.loading{display:flex;align-items:center;justify-content:center;padding:40px;gap:10px;color:var(--muted);font-size:13px;}
.loading iconify-icon{font-size:28px;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.empty{text-align:center;padding:40px 20px;color:var(--muted);}
.empty iconify-icon{font-size:46px;opacity:.3;display:block;margin:0 auto 10px;}
.empty p{font-size:13px;}
.fade-in{animation:fadeUp .25s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.leaflet-control-attribution{display:none !important;}
.news-badge{font-size:10px;font-weight:800;padding:2px 9px;border-radius:99px;display:inline-block;}
</style>
</head>
<body>
<div id="app">
  <div id="screen-container">

    <!-- ══ SHARED HEADER: خارج الـ screens — لا يتأثر بانتقال التابات
         z-index:1 → scroll-area (z-index:2) يغطيه عند السكرول ══ -->
    <div id="shared-header">
      <div class="shared-header-inner">
        <img class="header-logo"
          src="https://cdn.jsdelivr.net/gh/kimk6/chetaibi-assets-v1@main/ui/logo-mobile.png"
          alt="logo" onerror="this.style.display='none'" style="background:transparent">
        <div class="header-text">
          <h1>بلدية شطايبي</h1>
          <p>ولاية عنابة - الجزائر</p>
        </div>
        <div class="header-actions">
          <div class="header-action visible" id="ha-bell">
            <div class="header-btn">
              <iconify-icon icon="lucide:bell" style="color:#fff;font-size:18px;pointer-events:none"></iconify-icon>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ══ HOME ══ -->
    <div class="screen" id="screen-home">
      <div class="scroll-area" id="scroll-home">
        <div class="content-block">
          <div class="section" style="padding-top:16px">
            <div class="section-header">
              <span class="section-title">
                <iconify-icon icon="lucide:megaphone" style="color:#dc2626;pointer-events:none"></iconify-icon>الإعلانات
              </span>
              <button class="see-all" onclick="switchTab('news')">عرض الكل</button>
            </div>
            <div class="h-scroll" id="h-official">
              <div class="loading"><iconify-icon icon="lucide:loader-2"></iconify-icon></div>
            </div>
          </div>
          <div class="section">
            <div class="section-header">
              <span class="section-title">
                <iconify-icon icon="lucide:newspaper" style="color:#059669;pointer-events:none"></iconify-icon>آخر المستجدات
              </span>
              <button class="see-all" onclick="switchTab('news')">عرض الكل</button>
            </div>
            <div class="h-scroll" id="h-news">
              <div class="loading"><iconify-icon icon="lucide:loader-2"></iconify-icon></div>
            </div>
          </div>
          <div class="section">
            <div class="section-header">
              <span class="section-title">
                <iconify-icon icon="lucide:waves" style="color:#0ea5e9;pointer-events:none"></iconify-icon>شواطئ شطايبي
              </span>
              <button class="see-all" onclick="switchTab('map')">على الخريطة</button>
            </div>
            <div class="h-scroll" id="h-beaches">
              <div class="loading"><iconify-icon icon="lucide:loader-2"></iconify-icon></div>
            </div>
          </div>
          <div class="section">
            <div class="section-header">
              <span class="section-title">
                <iconify-icon icon="lucide:sun" style="color:#f59e0b;pointer-events
