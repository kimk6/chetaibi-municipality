<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161c1a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>شطايبي - 2026 Edition</title>

<!-- Fonts & Icons -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<style>
/* 
  ==============================================
    MATERIAL DESIGN 3 (Google 2026 Edition)
  ==============================================
*/
:root {
  /* MD3 Brand Palette (Green focus) */
  --green: #0f8b5f; --green-d: #0a6c49; --green-m: #12a571;
  --green-l: #E8F5EE; --green-xl: #F0F8F4; --green-dark: #042e1f;
  --green-glow: rgba(15, 139, 95, 0.15);
  
  --red: #B3261E; --red-l: #F9DEDC; --blue: #0A56D0; --blue-l: #E1E3DF;
  --amber: #EA8600; --amber-l: #FFDF99; --purple: #65558F; --purple-l: #E8DEF8;
  --sky: #00639B; --sky-l: #C2E7FF;

  /* Tonal Surfaces instead of pure white/gray */
  --surface: #F2F5F3; --surface-2: #ECEFEA; --surface-3: #E2E5E0;
  --card: #FFFFFF;

  /* Typography */
  --text: #171D1A; --text-2: #3F4944; --text-3: #707973;
  --muted: #707973; --muted-2: #89938D; --muted-3: #BFC9C3;
  
  /* Super subtle borders */
  --border: rgba(0,0,0,0.06); --border-light: rgba(0,0,0,0.03);

  /* Layout dimensions */
  --nav-h: 80px; 
  --header-h: 76px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);

  /* Elevation (Soft Diffuse Shadows) */
  --elev-3: 0 1px 3px rgba(0,0,0,.03), 0 4px 8px rgba(0,0,0,.04);
  --elev-card: 0 2px 8px rgba(0,0,0,.03), 0 0 0 1px rgba(0,0,0,.02);
  --elev-modal: 0 12px 32px rgba(0,0,0,.12), 0 4px 8px rgba(0,0,0,.04);

  /* Hyper-Rounded Radii */
  --r-xs: 12px; --r-sm: 16px; --r-md: 20px; --r-lg: 24px; --r-xl: 28px; --r-2xl: 32px; --r-full: 999px;

  /* Spring Mechanics */
  --dur-fast: 150ms; --dur-mid: 250ms; --dur-slow: 400ms;
  --ease-std: cubic-bezier(0.2, 0, 0, 1);
  --ease-spring: cubic-bezier(0.175, 0.885, 0.32, 1.1);

  --font-main: 'Cairo', 'Tajawal', sans-serif;
}

[data-theme="dark"] {
  --surface: #0e110f; --surface-2: #161c1a; --surface-3: #1f2824;
  --card: #161c1a;
  --text: #E0E3E1; --text-2: #BFC8C4; --text-3: #89938D;
  --muted: #89938D; --muted-2: #707973; --muted-3: #3F4944;
  --border: rgba(255,255,255,0.06); --border-light: rgba(255,255,255,0.03);
  --green-xl: rgba(15,139,95,0.12); --green-l: rgba(15,139,95,0.22);
}

*,*::before,*::after { margin:0; padding:0; box-sizing:border-box; outline:none !important; -webkit-tap-highlight-color: transparent; }
*::-webkit-scrollbar { display: none; }
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
body {
  font-family: var(--font-main);
  background: var(--surface);
  color: var(--text);
  position: fixed; width: 100%; top: 0; left: 0;
}

#app { display:flex; flex-direction:column; height: 100%; overflow:hidden; position:relative; }

/* Header */
#shared-header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 200;
  background: rgba(255,255,255,0.92); backdrop-filter: blur(24px);
  box-shadow: 0 1px 0 var(--border-light);
}
[data-theme="dark"] #shared-header { background: rgba(22, 28, 26, 0.96); }

.app-header-inner { display: flex; align-items: center; gap: 10px; padding: calc(var(--safe-t) + 10px) 16px 10px; }
.header-logo { width: 52px; height: 52px; border-radius: 50%; object-fit: contain; }
.header-text { flex: 1; }
.header-text h1 { font-size: 17px; font-weight: 900; letter-spacing: -0.5px; }
.header-text p { font-size: 12px; color: var(--muted); font-weight: 500; }
.hdr-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--surface); display: flex; align-items: center; justify-content: center; border: none; cursor: pointer; color: var(--text-2); transition: transform var(--dur-fast); }
.hdr-btn:active { transform: scale(0.9); }
.hdr-btn.notif-btn { background: var(--green-xl); color: var(--green); }

/* Screens & Scroll Areas */
#screen-container { flex: 1; position: relative; overflow: hidden; z-index: 2;}
.screen { position: absolute; inset: 0; overflow: hidden; will-change: transform, opacity; transition: transform var(--dur-mid) var(--ease-std), opacity var(--dur-mid) var(--ease-std); }
.screen.hidden { pointer-events: none; opacity: 0; transform: translateX(50px); display: none; }
.scroll-area { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior-y: contain; padding-top: var(--header-h); padding-bottom: 90px; }
.content-block { min-height: 100%; position: relative; padding-bottom: 20px; }

/* Sections */
.section { padding: 20px 0 6px; }
.section-header { display: flex; align-items: center; justify-content: space-between; padding: 0 16px; margin-bottom: 14px; }
.section-title { font-size: 16px; font-weight: 900; display: flex; align-items: center; gap: 8px; }
.see-all-arrow-btn { border: none; background: var(--green-xl); cursor: pointer; padding: 6px 14px; display: flex; align-items: center; justify-content: center; gap: 5px; border-radius: 99px; font-weight: 800; font-size: 12px; color: var(--green-dark); font-family: var(--font-main); transition: transform 0.15s; }
.see-all-arrow-btn:active { transform: scale(0.94); }

/* MD3 Enhanced Bottom Nav (Pill active state) */
#bottom-nav {
  height: calc(var(--nav-h) + var(--safe-b)); padding-bottom: var(--safe-b);
  background: rgba(255,255,255,0.92); backdrop-filter: blur(24px);
  border-top: 1px solid var(--border-light); 
  display: flex; align-items: flex-start; padding-top: 12px; z-index: 100;
  position: absolute; bottom: 0; width: 100%;
}
[data-theme="dark"] #bottom-nav { background: rgba(22, 28, 26, 0.96); }

.nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; font-size: 12px; font-weight: 700; color: var(--muted-2); font-family: var(--font-main); cursor: pointer; transition: color var(--dur-mid) var(--ease-std); }
.nav-icon-wrap { width: 64px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: var(--r-full); transition: background var(--dur-mid) var(--ease-std), transform var(--dur-fast) var(--ease-spring); }
.nav-btn.active .nav-icon-wrap { background: var(--green-l); }
.nav-btn:active .nav-icon-wrap { transform: scale(0.88); }
.nav-btn iconify-icon { font-size: 24px; position: absolute; transition: opacity var(--dur-mid); }
.nav-btn .icon-off { opacity: 1; } .nav-btn .icon-on { opacity: 0; }
.nav-btn.active .icon-off { opacity: 0; } .nav-btn.active .icon-on { opacity: 1; }
.nav-btn.active { color: var(--green-dark); }
.nav-btn span { font-size: 11.5px; font-weight: 800; transition: color var(--dur-mid); }

/* Unified Weather & Sea Card */
.weather-sea-unified-card { background: var(--card); border-radius: var(--r-xl); box-shadow: var(--elev-card); border: 1px solid var(--border-light); overflow: hidden; margin: 0 16px; }
.ws-tabs { display: flex; border-bottom: 1px solid var(--border-light); background: var(--card); }
[data-theme="dark"] .ws-tabs { background: transparent; }
.ws-tab { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 8px; background: transparent; border: none; font-family: var(--font-main); font-size: 14px; font-weight: 800; color: var(--muted-2); cursor: pointer; position: relative; }
.ws-tab::after { content: ''; position: absolute; bottom: 0; left: 20px; right: 20px; height: 3px; background: var(--green); border-radius: 3px 3px 0 0; transform: scaleX(0); transition: transform var(--dur-mid) var(--ease-spring); }
.ws-tab.active { color: var(--green); } .ws-tab.active::after { transform: scaleX(1); }
#ws-tab-sea.active { color: var(--blue); } #ws-tab-sea.active::after { background: var(--blue); }
.ws-panel { padding: 20px; } .ws-panel.hidden { display: none; }
#ws-panel-weather { background: var(--green-xl); } #ws-panel-sea { background: var(--sky-l); }
[data-theme="dark"] #ws-panel-weather { background: rgba(15,139,95,0.08); } 
[data-theme="dark"] #ws-panel-sea { background: rgba(0,99,155,0.08); }

.wcard-main { display: flex; align-items: center; justify-content: space-between; }
.wcard-primary { display: flex; align-items: center; gap: 12px; }
.wcard-emoji { font-size: 44px; }
.wcard-temp { font-size: 40px; font-weight: 900; line-height: 1; letter-spacing: -1.5px; }

/* MD3 Rounded Cards (No harsh borders, full tonal) */
.place-card { min-width: 158px; max-width: 158px; height: 212px; border-radius: 24px; box-shadow: var(--elev-3); overflow: hidden; position: relative; flex-shrink: 0; cursor: pointer; transition: transform var(--dur-fast), box-shadow var(--dur-fast); }
.place-card:active { transform: scale(0.95); box-shadow: var(--elev-1); }
.place-card img { width: 100%; height: 100%; object-fit: cover; }
.place-card-grad { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(0,0,0,0.78) 0%, transparent 70%); border-radius: 24px; }
.place-card-body { position: absolute; bottom: 0; left: 0; padding: 12px; }
.place-card-name { font-size: 15px; font-weight: 900; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.5); }

.h-scroll { display: flex; gap: 14px; overflow-x: auto; padding: 0 16px 20px; }

/* Announce (MD3 News Card) */
.ann-card { background: var(--card); border-radius: var(--r-xl); border: 1px solid var(--border-light); box-shadow: var(--elev-card); display: flex; flex-direction: row; overflow: hidden; margin: 0 16px 14px; transition: transform var(--dur-fast); cursor: pointer; }
.ann-card:active { transform: scale(0.97); }
.ann-card-side { width: 80px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 16px 0; background: linear-gradient(160deg, var(--green), var(--green-d)); }
.ann-card-side-icon { width: 44px; height: 44px; border-radius: 14px; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; }
.ann-card-body { padding: 16px; flex: 1; }
.ann-card-btn { display: inline-flex; align-items: center; gap: 5px; border-radius: 99px; padding: 6px 14px; font-family: var(--font-main); font-weight: 800; cursor: pointer; border: none; color: var(--green-dark); background: var(--green-xl); }

/* Quick Action / Map Loc */
#map-controls-left { position: absolute; top: 16px; left: 16px; z-index: 1001; }
#map-locate-btn { width: 48px; height: 48px; border-radius: 50%; border: none; background: var(--card); color: var(--muted); display: flex; align-items: center; justify-content: center; box-shadow: var(--elev-3); transition: transform var(--dur-fast); cursor: pointer; }
#map-locate-btn:active { transform: scale(0.9); }

</style>
</head>
<body>

<div id="app">
  <!-- Shared Header -->
  <header id="shared-header">
    <div class="app-header-inner">
      <img class="header-logo" src="https://cdn.jsdelivr.net/gh/kimk6/chetaibi-assets-v1@main/ui/new_512_any.png" alt="Logo">
      <div class="header-text">
        <h1>بلدية شطايبي</h1>
        <p>ولاية عنابة – الجزائر</p>
      </div>
      <div class="hdr-actions">
        <button class="hdr-btn"><iconify-icon icon="lucide:search"></iconify-icon></button>
        <button class="hdr-btn notif-btn"><iconify-icon icon="lucide:bell"></iconify-icon></button>
      </div>
    </div>
  </header>

  <main id="screen-container">
    
    <!-- Home Screen -->
    <div class="screen" id="screen-home" style="display: block; opacity: 1; transform: translateX(0);">
      <div class="scroll-area">
        <div class="content-block" style="padding-top: 20px;">
          
          <!-- Unified Advanced Card -->
          <div class="weather-sea-unified-card">
            <div class="ws-tabs">
              <button class="ws-tab active"><iconify-icon icon="lucide:sun"></iconify-icon> الطقس</button>
            </div>
            <div class="ws-panel" id="ws-panel-weather">
              <div class="wcard-main">
                <div class="wcard-primary">
                  <span class="wcard-emoji">☀️</span>
                  <div>
                    <div class="wcard-temp">24°</div>
                    <div style="font-size:14px; font-weight:600; color:var(--green-dark);">شطايبي — اليوم</div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Places -->
          <div class="section">
            <div class="section-header">
              <span class="section-title"><iconify-icon icon="lucide:waves" style="color:var(--sky)"></iconify-icon>شواطئ ساحرة</span>
              <button class="see-all-arrow-btn">الخريطة <iconify-icon icon="lucide:map"></iconify-icon></button>
            </div>
            <div class="h-scroll">
              <div class="place-card">
                <img src="https://lh5.googleusercontent.com/p/AF1QipPRRfy1iFwIap8bB8Q9g_q0l7O2R-i53fOqM7I0=w400-h300-k-no" alt="Sable">
                <div class="place-card-grad"></div>
                <div class="place-card-body"><div class="place-card-name">شاطئ الرمال الذهبية</div></div>
              </div>
              <div class="place-card">
                <img src="https://lh5.googleusercontent.com/p/AF1QipOT9S2LqD9T-Q1T2bX5qN3vM7C7G4L8F8I2hM_H=w400-h300-k-no" alt="Rocks">
                <div class="place-card-grad"></div>
                <div class="place-card-body"><div class="place-card-name">الخليج الغربي</div></div>
              </div>
            </div>
          </div>

          <div class="section">
            <div class="section-header">
              <span class="section-title"><iconify-icon icon="lucide:megaphone" style="color:var(--red)"></iconify-icon>الإعلانات الرسمية</span>
            </div>
            <div class="ann-card">
              <div class="ann-card-side">
                <div class="ann-card-side-icon"><iconify-icon icon="lucide:file-signature" style="font-size:24px; color:#fff;"></iconify-icon></div>
              </div>
              <div class="ann-card-body">
                <div style="font-size: 14px; font-weight: 800; color: var(--text); margin-bottom: 6px;">تجديد بطاقات الهوية</div>
                <div style="font-size: 12.5px; color: var(--muted); margin-bottom: 12px; line-height: 1.6;">تنهي مصالح البلدية إلى علم كافة المواطنين بضرورة التقرب من المصلحة البيومترية.</div>
                <button class="ann-card-btn">قراءة التفاصيل <iconify-icon icon="lucide:chevron-left"></iconify-icon></button>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>

    <div class="screen hidden" id="screen-dummy"></div>

  </main>

  <nav id="bottom-nav">
    <button class="nav-btn active" id="nav-home">
      <div class="nav-icon-wrap">
        <iconify-icon class="icon-off" icon="ph:house" style="font-size:24px; opacity:0;"></iconify-icon>
        <iconify-icon class="icon-on"  icon="ph:house-fill" style="font-size:24px; opacity:1;"></iconify-icon>
      </div>
      <span>الرئيسية</span>
    </button>
    <button class="nav-btn" id="nav-news">
      <div class="nav-icon-wrap">
        <iconify-icon class="icon-off" icon="ph:newspaper" style="font-size:24px;"></iconify-icon>
        <iconify-icon class="icon-on"  icon="ph:newspaper-fill" style="font-size:24px; opacity:0;"></iconify-icon>
      </div>
      <span>الأخبار</span>
    </button>
    <button class="nav-btn" id="nav-guide">
      <div class="nav-icon-wrap">
        <iconify-icon class="icon-off" icon="ph:map-pin" style="font-size:24px;"></iconify-icon>
        <iconify-icon class="icon-on"  icon="ph:map-pin-fill" style="font-size:24px; opacity:0;"></iconify-icon>
      </div>
      <span>الدليل</span>
    </button>
    <button class="nav-btn" id="nav-map">
      <div class="nav-icon-wrap">
        <iconify-icon class="icon-off" icon="ph:map-trifold" style="font-size:24px;"></iconify-icon>
        <iconify-icon class="icon-on"  icon="ph:map-trifold-fill" style="font-size:24px; opacity:0;"></iconify-icon>
      </div>
      <span>الخريطة</span>
    </button>
    <button class="nav-btn" id="nav-more">
      <div class="nav-icon-wrap">
        <iconify-icon class="icon-off" icon="ph:squares-four" style="font-size:24px;"></iconify-icon>
        <iconify-icon class="icon-on"  icon="ph:squares-four-fill" style="font-size:24px; opacity:0;"></iconify-icon>
      </div>
      <span>المزيد</span>
    </button>
  </nav>

</div>

<script>
  // Simple interactions for visual evaluation of MD3 implementation.
  const tabs = document.querySelectorAll('.nav-btn');
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      // Visual haptic tap logic
      if(navigator.vibrate) navigator.vibrate(10);
    });
  });

  // Adding Dark Mode Toggle Hook
  window.toggleTheme = () => {
    if(document.documentElement.getAttribute('data-theme') === 'dark') {
      document.documentElement.removeAttribute('data-theme');
    } else {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  };
</script>
</body>
</html>
